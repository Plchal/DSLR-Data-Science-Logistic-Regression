# =============================================================================
# pyproject.toml — DSLR
# =============================================================================

[project]
name = "dslr"
version = "0.1.0"
description = ""
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
follow_untyped_imports = true
strict = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.6",
    "scikit-learn>=1.9.1",
]
